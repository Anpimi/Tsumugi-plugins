name: Independent plugin candidates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: '1.98.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - name: Prepare the exact minimum Rust in this disposable runner
        run: rustup toolchain install 1.98.0 --profile minimal --no-self-update
      - name: Build every Rust target from the tracked SDK
        run: |
          rustc --version --verbose
          cargo --version
          python3 tooling/prepare-sdk.py
          cargo build --workspace --all-features --all-targets --locked
  independent-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.99.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.10.0'
      - name: Prepare exact build tools in this disposable runner
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          npm install --prefix "$RUNNER_TEMP/candidate-pnpm" --ignore-scripts --no-package-lock pnpm@12.8.1
          # pnpm 12 ships a shebang-less placeholder until its native binary is linked.
          # Run only this pinned tool's reviewed setup; project scripts stay disabled.
          node "$RUNNER_TEMP/candidate-pnpm/node_modules/pnpm/install.js"
          "$RUNNER_TEMP/candidate-pnpm/node_modules/.bin/pnpm" --version
          echo "$RUNNER_TEMP/candidate-pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build and check all independent candidates
        run: |
          mkdir -p artifacts/candidates
          python3 tooling/candidate-build.py --output artifacts/candidates/ci
      - name: Retain candidate archives and build records
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-candidates-${{ matrix.os }}
          path: |
            artifacts/candidates/ci/*.tar
            artifacts/candidates/ci/*-inspection.json
            artifacts/candidates/ci/candidate-build.json
            artifacts/candidates/ci/logs/*.log
          if-no-files-found: error
          retention-days: 14
