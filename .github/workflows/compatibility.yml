name: Pinned Host compatibility

on:
  workflow_dispatch:
    inputs:
      matrix:
        description: 'Reviewed formatVersion 1 JSON; exact public Host commits and HTTPS artifact identities'
        type: string
        required: true
      runner:
        description: 'Hosted runner matching the approved runtime platform'
        type: choice
        default: macos-14
        options: [macos-14, ubuntu-24.04]

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: '1.99.0'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - name: Prepare exact Rust in this disposable runner
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Capture the explicit matrix
        env:
          SELECTED_MATRIX: ${{ inputs.matrix }}
        run: |
          mkdir -p artifacts/compatibility
          python3 -c 'import json, os; from pathlib import Path; value=json.loads(os.environ["SELECTED_MATRIX"]); Path("artifacts/compatibility/selection.json").write_text(json.dumps(value), encoding="utf-8")'
      - name: Run exact prebuilt combinations through their public Host
        run: python3 tooling/compatibility-matrix.py --matrix artifacts/compatibility/selection.json --output artifacts/compatibility/result
      - name: Retain compatibility evidence without executable materials or caches
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-compatibility-${{ inputs.runner }}
          path: |
            artifacts/compatibility/selection.json
            artifacts/compatibility/result/compatibility-matrix.json
            artifacts/compatibility/result/*/host-results/compatibility.json
            artifacts/compatibility/result/*/host-results/*.log
            artifacts/compatibility/result/*/*.log
          if-no-files-found: error
          retention-days: 14
